[project]
name = "churn-dashboard"
version = "0.1.0"
description = "Retail Banking Customer Churn Dashboard built with Streamlit and Plotly"
authors = [
    { name = "Yedage Amit Ramesh", email = "amitryedage371@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
